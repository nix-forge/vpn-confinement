[files]
extend-exclude = [
  "flake.lock",
  "flake/dev/flake.lock",
  "site/bun.lock",
  # Raw iperf output contains random session identifiers.
  "site/public/benchmarks/*.json",
  "site/src/content/docs/reference/options-generated.md",
]

[default.extend-words]
intoto = "intoto" # SLSA provenance asset filename suffix.
ND = "ND"
noice = "noice"
