version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: build(deps)
      include: scope
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: bun
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: build(deps)
      include: scope
    ignore:
      # Astro's programmatic checker does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      docs-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: nix
    directories:
      - "/"
      - "/flake/dev"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
    commit-message:
      prefix: build(deps)
      include: scope
    groups:
      nix-inputs:
        patterns:
          - "*"
