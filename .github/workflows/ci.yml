name: CI
on:
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  flake-lock:
    name: Flake Lock (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - flake.lock
          - flake/dev/flake.lock
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
    with:
      lockfile: ${{ matrix.lockfile }}
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
        with:
          cache: 'false'
          cache-scope: ci-format
      - name: Check formatting
        run: nix fmt -- --fail-on-change
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
        with:
          cache: 'false'
          cache-scope: ci-lint
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
        with:
          hook-runner: pre-commit
  flake-check:
    name: Flake Check (${{ matrix.system }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs_on: ubuntu-latest
          - system: aarch64-linux
            runs_on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
        with:
          cache: 'false'
          cache-scope: ci-flake-check
      - name: Run flake checks
        run: >-
          nix flake check --keep-going --show-trace --print-build-logs --system "${TARGET_SYSTEM}"
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    needs: [flake-lock, format, lint, flake-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
