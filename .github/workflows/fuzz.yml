name: Fuzz nft policy diagnostics
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '53 8 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nft-policy:
    name: Fuzz nft policy diagnostics
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nix-forge/ci/actions/fuzz-atheris@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0-compatible fuzz action
        with:
          target: fuzz/nft_policy_fuzzer.py
