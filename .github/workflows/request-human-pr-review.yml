name: Request review for human pull requests
on: # zizmor: ignore[dangerous-triggers] This workflow does not check out or run pull request code. It only requests a reviewer from event metadata.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
permissions: {}
jobs:
  request-review:
    name: request-review
    permissions:
      pull-requests: write # Update pull request metadata.
    uses: nix-forge/ci/.github/workflows/request-review.yml@d84cb92725a2ab7eafcdc9d1f1fb7a06048dfa1a # v2.2.0
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
