name: Dependabot Auto-merge
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  enable-auto-merge:
    name: Enable Auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false && github.repository == 'IanHollow/vpn-confinement'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update branch when it is behind
        if: steps.metadata.outputs.package-ecosystem == 'github-actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          merge_state="$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)"
          if [[ "$merge_state" == "BEHIND" ]]; then
            gh pr update-branch "$PR_URL"
          fi
      - name: Approve non-major Actions updates
        if: >-
          steps.metadata.outputs.package-ecosystem == 'github-actions' && (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"
      - name: Enable squash auto-merge for non-major Actions updates
        if: >-
          steps.metadata.outputs.package-ecosystem == 'github-actions' && (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
