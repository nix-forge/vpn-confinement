name: Auto-merge
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] This workflow never checks out or executes pull request code; it only calls GitHub's merge API.
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  enable-auto-merge:
    name: Enable Auto-merge
    permissions:
      contents: write # Update trusted repository automation.
      pull-requests: write # Update pull request metadata.
    uses: nix-forge/ci/.github/workflows/automerge.yml@a75d21dababfd55145e2df1db81f3d2d865bec59 # v1.0.0
