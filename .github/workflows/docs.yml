name: Docs
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/package.json
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('site/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install site dependencies
        run: bun install --cwd site --frozen-lockfile
      - name: Audit site dependencies
        run: bun audit --cwd site --audit-level=high
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
        with:
          cache: 'false'
          cache-scope: docs-build
      - name: Generate options reference
        run: bash scripts/generate-options-doc.sh x86_64-linux
      - name: Build docs site
        run: bun run --cwd site build
      - name: Check generated documentation
        run: git diff --exit-code -- site/src/content/docs
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
  deploy:
    name: Deploy Docs
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # Required by this job.
      id-token: write # Authenticate the configured publication service.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@7903659c4b16378411a3ea79dd73cec5c82708cc # v2.0.0
